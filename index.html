<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="description" content="View music lyrics with comfort" />
  <title>Polystra</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon/favicon-16x16.png">
  <link rel="manifest" href="icons/favicon/site.webmanifest">
  <meta name="theme-color" content="#06F1DA">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body>
  <div id="controls">
    <div id="control-left">
      <a class="logo" href="index.html">
        <b>POLYSTRA</b>
      </a>
    </div>
    <div id="control-center">
    </div>
    <div id="control-right">
      <div class="btn" onclick="resetCompletedSongs();">
        <img src="icons/sync.svg">Reset completed
      </div>
      <div class="btn" onclick="resetAllOptions();">
        <img src="icons/trash.svg">Full reset
      </div>
    </div>
  </div>
  <div id="content">
    
    
    <div class="band-node">
      <div class="band-name" data-band="kolesa-team">Kolesa Team</div>
      
      <a class="song-name" href="pages/kolesa-team/1-30-лет.html" data-band="kolesa-team" data-song="1-30-лет">
        <span class="name">1 30 лет</span>
      </a>
      <br>
      
      <a class="song-name" href="pages/kolesa-team/2-break-stuff.html" data-band="kolesa-team" data-song="2-break-stuff">
        <span class="name">2 Break Stuff</span>
      </a>
      <br>
      
      <a class="song-name" href="pages/kolesa-team/3-царица.html" data-band="kolesa-team" data-song="3-царица">
        <span class="name">3 Царица</span>
      </a>
      <br>
      
      <a class="song-name" href="pages/kolesa-team/4-toxicity.html" data-band="kolesa-team" data-song="4-toxicity">
        <span class="name">4 Toxicity</span>
      </a>
      <br>
      
      <a class="song-name" href="pages/kolesa-team/5-седьмой-лепесток.html" data-band="kolesa-team" data-song="5-седьмой-лепесток">
        <span class="name">5 Седьмой лепесток</span>
      </a>
      <br>
      
      <a class="song-name" href="pages/kolesa-team/6-ты-не-верь-слезам.html" data-band="kolesa-team" data-song="6-ты-не-верь-слезам">
        <span class="name">6 Ты не верь слезам</span>
      </a>
      <br>
      
    </div>
    
    <br>
    <br>
    <br>
    <br>
  </div>

  <div id="mobile-fab" class="mobile-fab">
    <img src="icons/three-bars.svg" alt="Open actions">
  </div>

  <div id="mobile-fab-actions" class="mobile-fab-actions">
    <a class="fab-btn fab-link" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">
      <img class="left-img" src="icons/info.svg">
      Help
    </a>
    <div class="fab-btn" onclick="resetAllOptions();">
      <img class="left-img" src="icons/trash.svg">Full reset
    </div>
    <div class="fab-btn" onclick="resetCompletedSongs();">
      <img class="left-img" src="icons/sync.svg">Reset completed
    </div>
  </div>
</body>

<script src="js/options.js"></script>
<script src="js/mobile_fab.js"></script>
<script src="js/index.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    displayCompletedSongs();
    loadMobileFab();
  });
</script>

</html>
